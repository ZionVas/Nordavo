[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nordavo-support-agent"
version = "0.1.0"
description = "A cautious helpdesk ticket triage and reply agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nordavo-agent = "nordavo_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
